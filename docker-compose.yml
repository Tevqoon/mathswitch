services:
  web:
    build: .
    volumes:
      - db:/data
      - static:/static
    env_file:
      - web/.env
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - static:/static:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db:
  static:
